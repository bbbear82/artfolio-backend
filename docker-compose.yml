services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: artfolio
      POSTGRES_PASSWORD: artfolio
      POSTGRES_DB: artfolio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://artfolio:artfolio@db:5432/artfolio
    depends_on:
      - db

volumes:
  pgdata:
